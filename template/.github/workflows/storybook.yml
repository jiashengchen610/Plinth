# Managed by Plinth: rewritten on every publish so fixes reach published repositories. Edits here are replaced.
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Plinth's checks, from the Plinth release that last updated this workflow: token references that resolve to
      # nothing, generated files that no longer match the tokens, and components without component tokens, a story,
      # or with hardcoded values stop the deploy. Design reminders are listed in the run summary.
      - run: npx -y github:jiashengchen610/Plinth#v{{PLINTH_VERSION}} check
      # Not `npm ci`: a lockfile written on Windows or macOS can miss Linux-only optional packages (npm/cli#4828),
      # which makes `npm ci` refuse to install. `npm install` keeps the locked versions and fills those in.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Type errors or a failing interaction test stop the deploy; accessibility findings are reported, not blocking.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
